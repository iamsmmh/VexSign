# Render Blueprint for the VexSign backend. Private environment variables are
# configured in the Render dashboard and are never committed to this repo.
services:
  - type: web
    name: vexsign-premium
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: VEXSIGN_DB
        value: /data/vexsign.db
      - key: SEED_KEYS
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: PREMIUM_REPO_URLS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
