# Render Blueprint for the VexSign backend. Private environment variables are
# configured in the Render dashboard and are never committed to this repo.
services:
  - type: web
    name: vexsign-premium
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      # Set VEXSIGN_DB=/data/vexsign.db in the dashboard ONLY on paid plans
      # where you've mounted a persistent disk at /data. On free tier the
      # directory doesn't exist and isn't writable, so leaving it unset uses
      # a SQLite file next to the app (ephemeral but bootable; SEED_KEYS
      # below re-mints keys on every boot so nothing is lost).
      - key: SEED_KEYS
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: PREMIUM_REPO_URLS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
