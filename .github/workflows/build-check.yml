name: Build check

# Compiles the VexSign scheme (Debug, unsigned) on every push and pull request
# to main. It fails on any compiler error and - by default - on any warning in
# first-party code, so `main` never merges red and warnings do not pile up.
#
# Knobs (Settings → Secrets and variables → Actions → Variables):
#   BUILD_XCODE               Xcode version prefix to build with ("26.3", "26",
#                             "16.4"). Empty = newest Xcode on the runner image.
#                             NOTE: the code uses iOS 26 SDK API (.glassEffect,
#                             SWIFT_APPROACHABLE_CONCURRENCY, iOS 26 widget
#                             target), so Xcode 16 cannot build it; that is
#                             why the default is the newest toolchain.
#   BUILD_WARNINGS_AS_ERRORS  How warnings in first-party code (VexSign/,
#                             VexSignWidgetExtension/, VexSignTests/,
#                             AltSourceKit/, NimbleKit/) are treated:
#                             "true" (default) - every warning that is not in
#                             .github/build-warnings-baseline.json fails the
#                             check; the baseline (warnings the code had when
#                             the check was introduced) is reported and only
#                             ever shrinks. "strict" - every warning fails.
#                             "false" - report only. Dependency warnings never
#                             fail the check.
#
# The xcresult bundle and the raw log are attached to the run when the build
# fails; a regenerated warnings baseline is attached whenever it differs from
# the committed one. Compiler diagnostics are annotated inline on the PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      xcode:
        description: 'Xcode version prefix (e.g. "26.3", "16.4"). Empty = BUILD_XCODE variable or newest installed.'
        required: false
        default: ''
      warnings_as_errors:
        description: 'First-party warnings: true = fail on new ones (baseline tolerated), strict = fail on all, false = report only'
        type: choice
        options: ['true', 'strict', 'false']
        required: false
        default: 'true'

permissions:
  contents: read

# A newer push to the same branch/PR cancels the stale build.
concurrency:
  group: build-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: xcodebuild · VexSign · Debug
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # The `runner` context is not available in job-level env, so the scratch
      # paths are exported from a step instead.
      - name: Paths
        run: |
          {
            echo "DERIVED_DATA=${RUNNER_TEMP}/DerivedData"
            echo "RESULT_BUNDLE=${RUNNER_TEMP}/VexSign.xcresult"
            echo "BUILD_LOG=${RUNNER_TEMP}/xcodebuild.log"
          } >> "$GITHUB_ENV"

      - name: Select Xcode
        id: xcode
        env:
          REQUESTED_XCODE: ${{ inputs.xcode || vars.BUILD_XCODE || '' }}
        run: bash .github/scripts/select_xcode.sh

      # Swift package checkouts (Vapor, Nuke, ZIPFoundation, ...) are the slow
      # part of a cold build. Cache them keyed on the resolved package graph.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ steps.xcode.outputs.xcode_version }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.xcode.outputs.xcode_version }}-
            spm-${{ runner.os }}-

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -workspace VexSign.xcworkspace \
            -scheme VexSign \
            -derivedDataPath "$DERIVED_DATA" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            | tail -n 20

      - name: Build (Debug)
        id: build
        run: |
          set -uo pipefail
          # Unsigned generic iOS build: no certificates exist on the runner and
          # none are needed to prove the code compiles.
          xcodebuild \
            -workspace VexSign.xcworkspace \
            -scheme VexSign \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee "$BUILD_LOG" | { if command -v xcbeautify >/dev/null; then xcbeautify --quiet --renderer terminal --disable-logging; else cat; fi; }
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          if [ "${status}" -ne 0 ]; then
            echo "::error::xcodebuild exited with status ${status} - see the annotations and the summary."
          fi
          exit "${status}"

      # Annotates errors/warnings inline, writes the summary and enforces the
      # warnings gate. Runs even when the build step failed so the diagnostics
      # are always visible.
      - name: Report diagnostics
        id: report
        if: always() && steps.build.outcome != 'skipped'
        env:
          BUILD_EXIT: ${{ steps.build.outputs.exit_code }}
          # Dispatch input wins, then the repository variable, then the default.
          WARNINGS_AS_ERRORS: ${{ github.event_name == 'workflow_dispatch' && inputs.warnings_as_errors || (vars.BUILD_WARNINGS_AS_ERRORS || 'true') }}
        run: |
          python3 .github/scripts/xcodebuild_report.py \
            --log "$BUILD_LOG" \
            --build-exit "${BUILD_EXIT:-1}" \
            --warnings-as-errors "$WARNINGS_AS_ERRORS" \
            --baseline .github/build-warnings-baseline.json \
            --baseline-out "$RUNNER_TEMP/build-warnings-baseline.json" \
            --workspace "$GITHUB_WORKSPACE"

      # Warnings appeared or disappeared compared to the committed baseline:
      # offer the regenerated file so it can be committed as
      # .github/build-warnings-baseline.json (after fixing what is new).
      - name: Upload regenerated warnings baseline
        if: always() && steps.report.outputs.baseline_changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: build-warnings-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-warnings-baseline.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload xcresult and log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/VexSign.xcresult
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
