name: Upstream feature radar

# Collects what the related signers shipped recently - Feather, FeatherPlus,
# Ksign, KorSign, RyukSign, MySignReincarnated, SideStore, LiveContainer (see
# .github/scripts/upstream_sources.json) - and opens ONE issue with a
# checklist: every candidate commit is a task box with its author, date, the
# files it touches mapped onto VexSign's layout and an estimate of how cleanly
# it would apply. Merges, chores, translations and changes VexSign already
# has are filtered out; items shown in an earlier radar issue are not
# repeated.
#
# You choose: tick the boxes, then comment `/prepare` (or add the
# `prepare-merge` label) and the "Upstream merge kit" workflow prepares a
# branch + draft PR from exactly those commits. Nothing is merged on its own.
#
# Runs every Monday and on demand. Read-only towards upstream repositories.

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      sources:
        description: 'Sources to scan: "all" or comma-separated keys (feather, featherplus, ksign, korsign, ryuksign, mysign, sidestore, livecontainer)'
        required: false
        default: 'all'
      since_days:
        description: 'Look-back window in days'
        required: false
        default: '30'
      max_per_source:
        description: 'Max candidates listed per source in the issue'
        required: false
        default: '25'
      include_seen:
        description: 'Also list items that appeared in earlier radar issues'
        type: boolean
        required: false
        default: false
      create_issue:
        description: 'Open the checklist issue (untick for a report-only run)'
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-radar
  cancel-in-progress: false

jobs:
  radar:
    name: Scan upstream sources
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so commits VexSign already carries can be recognised.
          fetch-depth: 0

      - name: Collect candidates
        id: radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCES: ${{ inputs.sources || 'all' }}
          SINCE_DAYS: ${{ inputs.since_days || '30' }}
          MAX_PER_SOURCE: ${{ inputs.max_per_source || '25' }}
          INCLUDE_SEEN: ${{ inputs.include_seen == true && '--include-seen' || '' }}
          CREATE_ISSUE: ${{ (github.event_name == 'schedule' || inputs.create_issue == true) && '--create-issue' || '' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086  # INCLUDE_SEEN / CREATE_ISSUE are optional flags
          python3 .github/scripts/upstream_radar.py \
            --repo "${GITHUB_REPOSITORY}" \
            --sources "${SOURCES}" \
            --since-days "${SINCE_DAYS}" \
            --max-per-source "${MAX_PER_SOURCE}" \
            --out "${RUNNER_TEMP}/radar" \
            ${INCLUDE_SEEN} ${CREATE_ISSUE}

      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: upstream-radar-${{ github.run_id }}
          path: ${{ runner.temp }}/radar/
          if-no-files-found: ignore
          retention-days: 30

      - name: Result
        if: always()
        env:
          ISSUE_URL: ${{ steps.radar.outputs.issue_url }}
          CANDIDATES: ${{ steps.radar.outputs.candidates }}
        run: |
          if [ -n "${ISSUE_URL}" ]; then
            echo "::notice title=Upstream feature radar::${CANDIDATES} new candidate(s) - choose at ${ISSUE_URL}"
          else
            echo "::notice title=Upstream feature radar::${CANDIDATES:-0} candidate(s); no issue opened (report attached as artifact)"
          fi
