name: SwiftLint auto-fix

# Runs `swiftlint --fix` on pull requests to main (configuration: .swiftlint.yml)
# and pushes the corrections back to the PR branch as
# "style: auto-fix SwiftLint violations", credited to the VexSign developer.
# Remaining violations are annotated inline; nothing here blocks a merge.
#
# Scope: only the Swift files the PR touches are fixed, so a small PR never
# turns into a repository-wide reformat. Run the workflow manually (scope =
# all) against a branch to clean up everything at once.
#
# Fork pull requests get a read-only token, so for them the workflow reports
# what it would change instead of pushing.
#
# Optional secret CI_PUSH_TOKEN (a fine-grained PAT with contents: write):
# pushes made with the default GITHUB_TOKEN do not trigger other workflows,
# so the Build check does not re-run for the auto-fix commit. With a PAT it
# does.

on:
  pull_request:
    branches: [main]
    paths:
      - '**.swift'
      - '.swiftlint.yml'
      - '.github/workflows/lint-fix.yml'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Files to fix'
        type: choice
        options: [all, changed]
        default: all

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lint-fix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: swiftlint --fix
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
      # Same-repository branches can be pushed to. Fork PRs cannot (read-only token).
      CAN_PUSH: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
      HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.CI_PUSH_TOKEN || github.token }}
          fetch-depth: 0

      - name: Install SwiftLint
        run: |
          set -euo pipefail
          brew install swiftlint || { command -v swiftlint >/dev/null && echo "::warning::brew install swiftlint failed; using the SwiftLint preinstalled on the runner image."; }
          swiftlint version

      - name: Select Swift files
        id: files
        env:
          SCOPE: ${{ inputs.scope || 'changed' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LIST="$RUNNER_TEMP/swift-files.txt"
          : > "$LIST"
          if [ "$SCOPE" = "changed" ] && [ -n "$PR_NUMBER" ]; then
            # Only the files this PR adds or modifies. GitHub's own list is
            # authoritative (it is computed against the merge base, so files
            # that merely changed on main are never picked up).
            if gh api "repos/${BASE_REPO}/pulls/${PR_NUMBER}/files" --paginate \
                 --jq '.[] | select(.status != "removed") | select(.filename | endswith(".swift")) | .filename' > "$LIST.api"; then
              while IFS= read -r f; do [ -f "$f" ] && echo "$f"; done < "$LIST.api" > "$LIST"
            else
              # Fallback: merge base with the base commit (full fetch, never
              # --depth: a shallow boundary would hide the merge base).
              git fetch --no-tags "https://github.com/${BASE_REPO}.git" "$BASE_SHA" 2>/dev/null || true
              if MERGE_BASE="$(git merge-base "$BASE_SHA" HEAD 2>/dev/null)"; then
                git diff --name-only --diff-filter=ACMR "$MERGE_BASE" HEAD -- '*.swift' > "$LIST"
              else
                echo "::warning::Could not determine the files changed by this PR; skipping the auto-fix."
              fi
            fi
          elif [ "$SCOPE" = "all" ]; then
            git ls-files -- '*.swift' > "$LIST"
          else
            echo "::notice::No pull request context and scope is '${SCOPE}'; nothing to lint."
          fi
          COUNT="$(grep -c . "$LIST" || true)"
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "list=${LIST}" >> "$GITHUB_OUTPUT"
          echo "Scope: ${SCOPE} - ${COUNT} Swift file(s) selected"
          sed 's/^/  /' "$LIST"

      - name: swiftlint --fix
        if: steps.files.outputs.count != '0'
        env:
          LIST: ${{ steps.files.outputs.list }}
        run: |
          set -euo pipefail
          # --force-exclude keeps .swiftlint.yml's `excluded` in effect even
          # though the files are passed explicitly.
          tr '\n' '\0' < "$LIST" | xargs -0 swiftlint --fix --force-exclude --quiet || true

      - name: Detect changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet -- '*.swift'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "SwiftLint made no changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## SwiftLint auto-fix"
              echo
              echo '```'
              git diff --stat -- '*.swift'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit and push fixes
        if: steps.changes.outputs.changed == 'true' && env.CAN_PUSH == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_IDENTITY_NAME: ${{ vars.AUTOMATION_GIT_NAME }}
          GIT_IDENTITY_EMAIL: ${{ vars.AUTOMATION_GIT_EMAIL }}
        run: |
          set -euo pipefail
          bash .github/scripts/git_identity.sh
          git add -A -- '*.swift'
          git commit -q -m "style: auto-fix SwiftLint violations" \
            -m "Automated by the SwiftLint auto-fix workflow (.github/workflows/lint-fix.yml) using .swiftlint.yml."
          # Somebody may have pushed meanwhile; rebase once, then give up
          # gracefully (the next PR update re-runs this workflow).
          if ! git push origin "HEAD:refs/heads/${HEAD_REF}"; then
            git fetch origin "${HEAD_REF}"
            git rebase "origin/${HEAD_REF}" || { git rebase --abort; echo "::warning::Could not rebase the auto-fix commit onto the updated branch; it will be retried on the next push."; exit 0; }
            git push origin "HEAD:refs/heads/${HEAD_REF}" || { echo "::warning::Could not push the auto-fix commit; it will be retried on the next push."; exit 0; }
          fi
          echo "Pushed SwiftLint fixes to ${HEAD_REF} as $(git log -1 --format='%h (%an)')"
          echo "- Pushed as \`$(git rev-parse --short HEAD)\` to \`${HEAD_REF}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Fixes could not be pushed (fork)
        if: steps.changes.outputs.changed == 'true' && env.CAN_PUSH != 'true'
        run: |
          echo "::warning::This pull request comes from a fork, so the SwiftLint fixes cannot be pushed automatically. Run 'swiftlint --fix' locally and push."
          echo "- Not pushed: fork pull request (run \`swiftlint --fix\` locally)" >> "$GITHUB_STEP_SUMMARY"

      # Whatever --fix could not correct is annotated inline (warnings only).
      - name: Report remaining violations
        if: steps.files.outputs.count != '0'
        env:
          LIST: ${{ steps.files.outputs.list }}
        run: |
          set -euo pipefail
          tr '\n' '\0' < "$LIST" | xargs -0 swiftlint lint --force-exclude --quiet --reporter github-actions-logging || true
          tr '\n' '\0' < "$LIST" | xargs -0 swiftlint lint --force-exclude --quiet --reporter json > "$RUNNER_TEMP/swiftlint.json" || true
          python3 - "$RUNNER_TEMP/swiftlint.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import collections, json, sys
          try:
              data = json.load(open(sys.argv[1]))
          except Exception:
              data = []
          if not data:
              print("\nNo remaining SwiftLint violations in the selected files.")
              sys.exit(0)
          by_rule = collections.Counter(item["rule_id"] for item in data)
          print(f"\n### Remaining SwiftLint violations: {len(data)}\n")
          print("| Rule | Count |\n|---|---:|")
          for rule, count in by_rule.most_common(20):
              print(f"| `{rule}` | {count} |")
          PY
