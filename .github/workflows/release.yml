name: Release

on:
  workflow_dispatch:
    inputs:
      xcode:
        description: >-
          Xcode version to build with (e.g. "26.3", "16.4"). Leave empty to use
          the newest Xcode installed on the runner image.
        required: false
        default: ''
  # Compile-check every PR the same way a release builds, so `main` never
  # merges red again. The release itself still only publishes from `main`.
  pull_request:
    branches: [main]

permissions:
  contents: write
  # Only so a failing build can comment its own log tail on the PR (the Actions
  # log CDN is not reachable from every reviewer environment).
  pull-requests: write

# Only one release build at a time; never cancel a run that is already
# uploading assets.
concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Zsign and IDeviceKitten are git submodules and are required to build.
          submodules: recursive
          # agvtool and `git rev-parse HEAD` both need the real git history.
          fetch-depth: 0

      - name: Select Xcode
        env:
          REQUESTED_XCODE: ${{ inputs.xcode }}
        run: |
          set -euo pipefail

          # Runner images ship several Xcodes side by side and rotate them over
          # time, so resolve a bundle instead of hardcoding an absolute path.
          shopt -s nullglob
          if [ -n "${REQUESTED_XCODE}" ]; then
            candidates=(/Applications/Xcode_"${REQUESTED_XCODE}"*.app)
          else
            candidates=(/Applications/Xcode_*.app)
          fi

          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "::error::No Xcode matching '${REQUESTED_XCODE:-*}' is installed on this runner."
            echo "Installed Xcodes:"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi

          # Highest version wins when we auto-select. Plain lexicographic sort
          # is used because BSD sort on macOS has no portable `-V`.
          if [ -n "${REQUESTED_XCODE}" ]; then
            XCODE_APP="${candidates[0]}"
          else
            XCODE_APP="$(printf '%s\n' "${candidates[@]}" | sort | tail -n 1)"
          fi

          echo "Using ${XCODE_APP}"
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Compile VexSign
        run: |
          set -euo pipefail

          BUILD_NUMBER="$(git rev-parse HEAD)"
          if ! agvtool new-version -all "${BUILD_NUMBER}"; then
            echo "::warning::agvtool could not stamp the build number (${BUILD_NUMBER}); continuing with the committed CURRENT_PROJECT_VERSION."
          fi

          # Tee the build log so a later step can surface the compiler errors as
          # annotations (and we keep a copy if the log CDN is unreachable).
          make 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

          if ! ls packages/*.ipa >/dev/null 2>&1; then
            echo "::error::make finished but produced no .ipa in packages/."
            exit 1
          fi

          mkdir -p upload
          mv packages/*.ipa upload/

      - name: Surface build errors
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          LOG="$RUNNER_TEMP/xcodebuild.log"
          if [ -f "$LOG" ]; then
            # File-scoped compiler errors → annotations with location.
            grep -nE "error:" "$LOG" | sed -E 's/^([0-9]+):[[:space:]]*([^:]+):([0-9]+):([0-9]+):[^:]*:[[:space:]]*(.*)$/::error file=\2,line=\3,col=\4::\5/' | head -150
            # Anything the first pass missed (linker, subsystem) → plain error.
            grep -E "error:" "$LOG" | grep -vE ":[0-9]+:[0-9]+:[[:space:]]*error:" | sed -E 's/^[[:space:]]*(.*)$/::error::\1/' | head -30
          fi

          # A failure with no Swift diagnostics (bad project file, broken build
          # phase, packaging) leaves nothing readable behind, and the log CDN
          # is unreachable from some reviewer environments — post the tail.
          python3 tools/post_build_log.py "$LOG" "${{ github.repository }}" \
            "${{ github.event.pull_request.number }}"
          exit 0

      - name: Get Version
        id: get_version
        run: |
          set -euo pipefail

          # `make` leaves a Payload -> <build dir>/Payload symlink next to the
          # project so the staged .app can be inspected after the build.
          shopt -s nullglob
          plists=(Payload/*.app/Info.plist)
          if [ "${#plists[@]}" -eq 0 ]; then
            echo "::error::No built app bundle found under Payload/ - did the build succeed?"
            exit 1
          fi

          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "${plists[0]}")"
          if [ -z "${VERSION}" ]; then
            echo "::error::Could not read CFBundleShortVersionString from ${plists[0]}."
            exit 1
          fi

          echo "Building release for version ${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        # PR runs are compile checks only — only a manual dispatch on `main`
        # publishes a release.
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          name: VexSign v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            upload/*.ipa
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
