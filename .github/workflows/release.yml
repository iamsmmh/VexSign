name: Release

on:
  # Manual build (specify Xcode version if needed).
  workflow_dispatch:
    inputs:
      xcode:
        description: >-
          Xcode version to build with (e.g. "26.3", "16.4"). Leave empty to use
          the newest Xcode installed on the runner image.
        required: false
        default: ''
      prerelease:
        description: "Mark as prerelease?"
        required: false
        type: boolean
        default: false
      draft:
        description: "Create as draft?"
        required: false
        type: boolean
        default: false
  # Push a tag like v1.2.0 to publish automatically.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # Compile-check every PR so `main` never merges red. PR runs do NOT publish.
  pull_request:
    branches: [main]

permissions:
  contents: write

# Only one release build at a time; never cancel a run already uploading.
concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          # Full history is required for agvtool and for changelog generation
          # (we diff against the previous release tag).
          fetch-depth: 0

      - name: Select Xcode
        env:
          REQUESTED_XCODE: ${{ inputs.xcode }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          if [ -n "${REQUESTED_XCODE}" ]; then
            candidates=(/Applications/Xcode_"${REQUESTED_XCODE}"*.app)
          else
            candidates=(/Applications/Xcode_*.app)
          fi

          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "::error::No Xcode matching '${REQUESTED_XCODE:-*}' is installed on this runner."
            echo "Installed Xcodes:"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi

          if [ -n "${REQUESTED_XCODE}" ]; then
            XCODE_APP="${candidates[0]}"
          else
            XCODE_APP="$(printf '%s\n' "${candidates[@]}" | sort | tail -n 1)"
          fi

          echo "Using ${XCODE_APP}"
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Compile VexSign
        run: |
          set -euo pipefail

          BUILD_NUMBER="$(git rev-parse HEAD)"
          if ! agvtool new-version -all "${BUILD_NUMBER}"; then
            echo "::warning::agvtool could not stamp the build number (${BUILD_NUMBER}); continuing with the committed CURRENT_PROJECT_VERSION."
          fi

          make 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

          if ! ls packages/*.ipa >/dev/null 2>&1; then
            echo "::error::make finished but produced no .ipa in packages/."
            exit 1
          fi

          mkdir -p upload
          mv packages/*.ipa upload/

      - name: Surface build errors
        if: failure()
        run: |
          set +e
          LOG="$RUNNER_TEMP/xcodebuild.log"
          if [ -f "$LOG" ]; then
            grep -nE "error:" "$LOG" | sed -E 's/^([0-9]+):[[:space:]]*([^:]+):([0-9]+):([0-9]+):[^:]*:[[:space:]]*(.*)$/::error file=\2,line=\3,col=\4::\5/' | head -150
            grep -E "error:" "$LOG" | grep -vE ":[0-9]+:[0-9]+:[[:space:]]*error:" | sed -E 's/^[[:space:]]*(.*)$/::error::\1/' | head -30
          fi
          exit 0

      - name: Get Version
        id: get_version
        run: |
          set -euo pipefail

          shopt -s nullglob
          plists=(Payload/*.app/Info.plist)
          if [ "${#plists[@]}" -eq 0 ]; then
            echo "::error::No built app bundle found under Payload/ - did the build succeed?"
            exit 1
          fi

          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "${plists[0]}")"
          if [ -z "${VERSION}" ]; then
            echo "::error::Could not read CFBundleShortVersionString from ${plists[0]}."
            exit 1
          fi

          echo "Building release for version ${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate Changelog
        id: changelog
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          bash tools/generate-changelog.sh > "$RUNNER_TEMP/CHANGELOG.md"
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/CHANGELOG.md" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "--- Changelog preview ---"
          cat "$RUNNER_TEMP/CHANGELOG.md"
          echo "--- end ---"

      - name: Create Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          name: VexSign v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          # On a tag push, the ref is refs/tags/vX.Y.Z; create the release
          # against that tag. On manual dispatch from main, target main.
          target_commitish: ${{ github.ref_type == 'tag' && github.ref_name || github.event.repository.default_branch }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            upload/*.ipa
          fail_on_unmatched_files: true
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
