name: Quick check (no build)

# Catches build-breaking mistakes in about a minute on a Linux runner, without
# Xcode and without compiling the dependency graph:
#
#   * unresolved merge-conflict markers
#   * Swift syntax errors (real `swiftc -parse` diagnostics from the official
#     Swift container - no SDK or package resolution needed)
#   * duplicate top-level types / duplicate file names inside one target
#   * Info.plist, entitlements, *.xcstrings, *.json, *.xcscheme that no longer
#     parse, and a corrupted project.pbxproj
#
# Findings are annotated inline (file + line) and listed in the job summary
# with the offending source lines, so they can be fixed straight away while
# the full "Build check" is still queued. See .github/scripts/quick_check.py.
#
# Knob: repository variable QUICK_CHECK_SWIFT_IMAGE (default swift:6.4-noble)
# to pin the Swift toolchain used for parsing.

on:
  push:
    branches: ['**']
    paths:
      - '**.swift'
      - '**.plist'
      - '**.entitlements'
      - '**.xcstrings'
      - '**.json'
      - '**.pbxproj'
      - '**.xcscheme'
      - '.github/scripts/quick_check.py'
      - '.github/workflows/quick-check.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick-check:
    name: syntax · duplicates · resources
    # Runs for the branch push (its head) AND for the pull request (the merge
    # with main): the two can differ when main moved on, and this check is
    # cheap enough to do both.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ vars.QUICK_CHECK_SWIFT_IMAGE || 'swift:6.4-noble' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain
        run: |
          swiftc --version
          python3 --version || (apt-get update -qq && apt-get install -y -qq python3 >/dev/null)

      - name: Quick check
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          python3 .github/scripts/quick_check.py --root . --json "$RUNNER_TEMP/quick-check.json"

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quick-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quick-check.json
          if-no-files-found: ignore
          retention-days: 7
