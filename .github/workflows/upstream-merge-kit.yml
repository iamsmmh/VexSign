name: Upstream merge kit

# Second half of the upstream workflow. After you tick items in a radar issue
# (see upstream-features.yml), trigger this by
#
#   * commenting `/prepare` on the issue, or
#   * adding the `prepare-merge` label to it, or
#   * running it manually with the issue number.
#
# It fetches the ticked upstream commits, rewrites their paths onto VexSign's
# layout, applies them with a 3-way merge on a fresh branch
# `upstream-kit/issue-<n>` off main, commits them credited to the VexSign
# developer (upstream repo/commit/author/license recorded in trailers), pushes
# the branch, opens or refreshes a DRAFT pull request with a per-commit result
# table, and comments the same table on the issue. Anything that conflicts is
# left out of the branch and provided as a patch file + conflict snapshot in
# the run artifact. Nothing is merged automatically.
#
# Knobs: repository variables AUTOMATION_GIT_NAME / AUTOMATION_GIT_EMAIL
# (commit identity; default = repository owner's GitHub profile) and
# MERGE_KIT_CREDIT (vexsign | shared | upstream, default vexsign). Optional
# secret CI_PUSH_TOKEN so the pushed branch triggers the Build/Quick checks.

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Radar issue number'
        required: true
      base:
        description: 'Branch to build the kit on'
        required: false
        default: 'main'
      credit:
        description: 'Commit credit: vexsign (author = VexSign developer, upstream in trailers), shared (+ Co-authored-by), upstream (keep upstream author)'
        type: choice
        options: [vexsign, shared, upstream]
        required: false
        default: 'vexsign'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-merge-kit-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  kit:
    name: Prepare branch, draft PR and patches
    # Only maintainers can start a kit: the label needs triage rights anyway,
    # and `/prepare` comments are accepted from owner/members/collaborators only.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'prepare-merge') ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/prepare') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      KIT_BASE: ${{ inputs.base || 'main' }}
      CREDIT_MODE: ${{ inputs.credit || vars.MERGE_KIT_CREDIT || 'vexsign' }}
    steps:
      - name: Acknowledge
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --silent -X POST "repos/${GITHUB_REPOSITORY}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes || true

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.base || 'main' }}
          fetch-depth: 0
          token: ${{ secrets.CI_PUSH_TOKEN || github.token }}

      - name: Git identity (credit the VexSign developer)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_IDENTITY_NAME: ${{ vars.AUTOMATION_GIT_NAME }}
          GIT_IDENTITY_EMAIL: ${{ vars.AUTOMATION_GIT_EMAIL }}
        run: bash .github/scripts/git_identity.sh

      - name: Build the merge kit
        id: kit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/upstream_merge_kit.py \
            --issue "${ISSUE_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${KIT_BASE}" \
            --credit "${CREDIT_MODE}" \
            --out "${RUNNER_TEMP}/merge-kit"

      - name: Upload kit (patches, manual hunks, conflict snapshots, report)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: merge-kit-issue-${{ env.ISSUE_NUMBER }}
          path: ${{ runner.temp }}/merge-kit/
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true

      - name: Report failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --body "🧰 **Merge kit failed** - see the run log: ${RUN_URL}. Nothing was pushed." || true

      - name: Result
        if: always()
        env:
          PR_URL: ${{ steps.kit.outputs.pr_url }}
          APPLIED: ${{ steps.kit.outputs.applied }}
          CONFLICTS: ${{ steps.kit.outputs.conflicts }}
        run: |
          echo "::notice title=Upstream merge kit::${APPLIED:-0} applied, ${CONFLICTS:-0} conflict(s)${PR_URL:+ - draft PR: $PR_URL}"
