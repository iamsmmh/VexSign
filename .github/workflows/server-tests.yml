name: Server tests

# Runs the Python backend's test suite: the premium key flow, the self-hosted
# source store, and the browser tools (repository creator, certificate status
# checker, UDID grabber). Fast enough to run on every change under server/.

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest · server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
          # Optional: full X.509 parsing in the certificate checker. The tests
          # skip that case when it is absent, so the suite passes either way.
          pip install cryptography

      - name: Run tests
        run: python -m pytest tests/ -q
